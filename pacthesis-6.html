<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>pacthesis角色测试问卷</title>
    <style>
        :root {
            --primary: #e0cc5a;
            --primary-light: #e8d87a;
            --primary-dark: #c4b04a;
            --bg: #ffffff;
            --card-bg: #ffffff;
            --text: #242438;
            --text-light: #242438;
            --border: #e8e8ec;
            --shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 4px 24px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
            --font: 'LXGW 975 MaruGo SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            line-height: 1.6;
            padding: 0;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            width: 100%;
            max-width: 640px;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.03);
        }

        /* ===== 顶部装饰条 ===== */
        .top-bar {
            width: 100%;
            height: 40px;
            background: var(--primary);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 200;
        }

        /* ===== 顶部进度区 ===== */
        .header {
            padding: 16px 20px 12px;
            position: sticky;
            top: 5px;
            background: var(--bg);
            z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            display: none;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.5px;
        }
        .header-counter {
            font-size: 0.85rem;
            color: var(--text);
            font-weight: 500;
        }
        .progress-track {
            width: 100%;
            height: 6px;
            background: #eaeaf0;
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 100px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
            position: relative;
        }

        /* ===== 内容区 ===== */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 20px 24px;
            animation: fadeIn 0.35s ease;
            background: var(--bg);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 欢迎页 ===== */
        .welcome-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            text-align: center;
            gap: 22px;
            animation: fadeIn 0.5s ease;
            padding: 20px 0;
        }
        .welcome-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 2px;
            line-height: 1.3;
            margin-top: 10px;
        }
        .welcome-title span {
            color: var(--primary);
        }
        .welcome-disclaimer {
            font-size: 0.85rem;
            color: var(--text);
            max-width: 320px;
            line-height: 1.7;
            background: #f8f8fa;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--primary);
        }
        .btn-start {
            padding: 16px 48px;
            border-radius: 100px;
            border: none;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            background: var(--primary);
            color: var(--text);
            box-shadow: 0 4px 16px rgba(224, 204, 90, 0.35);
            touch-action: manipulation;
            letter-spacing: 1px;
            margin-top: 4px;
            font-family: var(--font);
        }
        .btn-start:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(224, 204, 90, 0.25);
        }
        .btn-start:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 24px rgba(224, 204, 90, 0.40);
        }

        /* ===== 题目页 ===== */
        #questionScreen {
            display: none;
            flex-direction: column;
            flex: 1;
        }
        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            border: 1px solid #f0f0f2;
        }
        .question-number-tag {
            display: inline-block;
            font-size: 0.75rem;
            color: var(--text);
            font-weight: 600;
            background: #f4f4f6;
            padding: 4px 14px;
            border-radius: 100px;
            margin-bottom: 14px;
            letter-spacing: 0.3px;
            align-self: flex-start;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.7;
            margin-bottom: 28px;
            color: var(--text);
            letter-spacing: 0.2px;
        }

        /* 选项区 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: #fafafc;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.95rem;
            color: var(--text);
            font-weight: 500;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            min-height: 50px;
            touch-action: manipulation;
            font-family: var(--font);
        }
        .option-btn:active {
            transform: scale(0.97);
            background: #f0f0f4;
        }
        .option-btn .radio-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #c8c8d0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            background: white;
        }
        .option-btn .radio-dot::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            transform: scale(0);
            transition: var(--transition);
        }
        .option-btn.selected {
            border-color: var(--primary);
            background: rgba(224, 204, 90, 0.08);
            box-shadow: 0 2px 10px rgba(224, 204, 90, 0.12);
        }
        .option-btn.selected .radio-dot {
            border-color: var(--primary);
        }
        .option-btn.selected .radio-dot::after {
            transform: scale(1);
        }

        /* 导航按钮 */
        .nav-buttons {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }
        .nav-btn {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            flex: 1;
            text-align: center;
            touch-action: manipulation;
            letter-spacing: 0.3px;
            font-family: var(--font);
            color: var(--text);
        }
        .nav-btn:active {
            transform: scale(0.96);
        }
        .btn-prev {
            background: #f1f2f6;
            color: var(--text);
            flex: 0 0 auto;
            padding: 14px 24px;
        }
        .btn-prev:hover {
            background: #e5e6ea;
        }
        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f1f2f6;
        }
        .btn-next {
            background: var(--primary);
            color: var(--text);
            flex: 1;
            box-shadow: 0 4px 14px rgba(224, 204, 90, 0.30);
        }
        .btn-next:hover:not(:disabled) {
            background: var(--primary-dark);
            box-shadow: 0 6px 20px rgba(224, 204, 90, 0.35);
        }
        .btn-next:disabled {
            background: #d0d0d8;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.5;
            color: #888;
        }

        /* ===== 结果页 ===== */
        .result-container {
            display: none;
            flex-direction: column;
            gap: 18px;
            animation: fadeIn 0.5s ease;
            flex: 1;
            justify-content: center;
        }
        .result-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 28px 32px;
            text-align: center;
            border: 1px solid #f0f0f2;
        }
        .result-role-name {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .result-role-name span {
            color: var(--primary);
        }
        .result-role-desc {
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.7;
            margin-bottom: 12px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .result-match-percent {
            display: inline-block;
            padding: 6px 20px;
            background: rgba(224, 204, 90, 0.12);
            color: var(--text);
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-restart {
            padding: 16px 24px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            background: var(--primary);
            color: var(--text);
            box-shadow: 0 4px 14px rgba(224, 204, 90, 0.30);
            width: 100%;
            text-align: center;
            touch-action: manipulation;
            letter-spacing: 0.3px;
            font-family: var(--font);
        }
        .btn-restart:active {
            transform: scale(0.97);
        }
        .btn-restart:hover {
            background: var(--primary-dark);
            box-shadow: 0 6px 20px rgba(224, 204, 90, 0.35);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .header { padding: 12px 14px 10px; }
            .content { padding: 14px 14px 20px; }
            .question-card { padding: 20px 16px; }
            .question-text { font-size: 1.05rem; margin-bottom: 20px; line-height: 1.6; }
            .option-btn { padding: 12px 14px; font-size: 0.85rem; gap: 10px; min-height: 44px; }
            .option-btn .radio-dot { width: 18px; height: 18px; }
            .option-btn .radio-dot::after { width: 8px; height: 8px; }
            .nav-btn { padding: 12px 16px; font-size: 0.9rem; }
            .btn-prev { padding: 12px 16px; }
            .result-role-name { font-size: 1.6rem; }
            .welcome-title { font-size: 1.8rem; }
            .btn-start { padding: 14px 32px; font-size: 1rem; }
            .result-card { padding: 28px 18px 24px; }
        }
        @media (max-width: 360px) {
            .question-text { font-size: 0.95rem; }
            .option-btn { font-size: 0.8rem; padding: 10px 12px; min-height: 40px; }
            .header-title { font-size: 0.95rem; }
            .header-counter { font-size: 0.75rem; }
            .welcome-title { font-size: 1.5rem; }
        }
        @media (min-width: 768px) {
            .app-container {
                border-left: 1px solid #f0f0f2;
                border-right: 1px solid #f0f0f2;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.04);
            }
            .question-text { font-size: 1.25rem; }
            .option-btn { font-size: 1rem; padding: 16px 20px; min-height: 54px; }
            .option-btn:hover { border-color: var(--primary-light); background: rgba(224, 204, 90, 0.04); }
            .result-role-name { font-size: 2.2rem; }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- 顶部装饰条（始终显示） -->
        <div class="top-bar"></div>

        <!-- 顶部进度区 (测试开始后显示) -->
        <div class="header" id="header">
            <div class="header-top">
                <span class="header-title">角色测试</span>
                <span class="header-counter" id="headerCounter">1 / 36</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="content" id="contentArea">

            <!-- 欢迎页 -->
            <div class="welcome-container" id="welcomeScreen">
                <div class="welcome-title">pacthesis<br><span>角色测试问卷</span></div>
                <div class="welcome-disclaimer">
                    免责声明：本测试仅供娱乐参考，角色性格均来自作者本人理解，不构成任何专业心理评估或建议。
                </div>
                <button class="btn-start" id="btnStart" onclick="startTest()">开始测试</button>
            </div>

            <!-- 题目页 -->
            <div id="questionScreen">
                <div class="question-card" id="questionCard">
                    <span class="question-number-tag" id="questionTag">第 1 题</span>
                    <div class="question-text" id="questionText"></div>
                    <div class="options" id="optionsContainer"></div>
                </div>
                <div class="nav-buttons" id="navButtons">
                    <button class="nav-btn btn-prev" id="btnPrev" onclick="prevQuestion()">← 上一题</button>
                    <button class="nav-btn btn-next" id="btnNext" onclick="nextQuestion()" disabled>下一题 →</button>
                </div>
            </div>

            <!-- 结果页 -->
            <div class="result-container" id="resultScreen">
                <div class="result-card">
                    <div class="result-role-name" id="resultRoleName"><span>角色名称</span></div>
                    <div class="result-role-desc" id="resultRoleDesc">角色描述占位，请自行填写。</div>
                    <span class="result-match-percent" id="resultMatchPercent">匹配度：0%</span>
                </div>
                <button class="btn-restart" onclick="restartTest()">重新测试</button>
            </div>

        </div>
    </div>

    <script>
        // ============ 题库数据 ============
        const questions = [
            // 维度一：外向性（1-6）
            { id: 1, dim: 0, text: '在聚会或社交场合中，我通常主动与陌生人交谈。', reverse: false },
            { id: 2, dim: 0, text: '比起一群人一起活动，我更喜欢独处或与一两个密友相处。', reverse: true },
            { id: 3, dim: 0, text: '当我感到疲惫时，与他人相处能让我恢复精力。', reverse: false },
            { id: 4, dim: 0, text: '我常常在群体中发言，表达自己的想法。', reverse: false },

            { id: 6, dim: 0, text: '我倾向于先观察环境，而不是立即加入谈话。', reverse: true },

            { id: 7, dim: 1, text: '做决定时，我主要依靠逻辑和客观分析。', reverse: false },

            { id: 9, dim: 1, text: '即使某个决定会让人难过，只要合理我就会坚持。', reverse: false },
            { id: 10, dim: 1, text: '在做重要选择时，我的直觉和情感比数据更重要。', reverse: true },
            { id: 11, dim: 1, text: '我善于发现方案中的逻辑漏洞。', reverse: false },
            { id: 12, dim: 1, text: '当看到别人陷入困境时，我会先感到同情，而不是分析问题。', reverse: true },
            // 维度三：独立/依赖（13-18）
            { id: 13, dim: 2, text: '我喜欢自己解决问题，而不是寻求他人帮助。', reverse: false },
            { id: 14, dim: 2, text: '在做决定前，我通常需要征求他人的意见。', reverse: true },
            { id: 15, dim: 2, text: '我更喜欢独立完成任务，而不是在团队中工作。', reverse: false },

            { id: 19, dim: 3, text: '我喜欢制定详细的计划并严格执行。', reverse: false },
            { id: 20, dim: 3, text: '面对临时变动，我能轻松调整计划。', reverse: true },
            { id: 21, dim: 3, text: '我的生活和工作空间通常井井有条。', reverse: false },
            { id: 22, dim: 3, text: '我更喜欢灵活安排时间，而不是遵循固定日程。', reverse: true },
            { id: 23, dim: 3, text: '不按规则做事会让我感到不安。', reverse: false },
            { id: 24, dim: 3, text: '我享受即兴发挥，而不是事先准备。', reverse: true },
            // 维度五：冒险/谨慎（25-30）
            { id: 25, dim: 4, text: '我喜欢尝试新鲜刺激的活动，即使有一定风险。', reverse: false },
            { id: 26, dim: 4, text: '在做决定前，我会仔细评估所有可能的负面后果。', reverse: true },
            { id: 27, dim: 4, text: '比起稳定但枯燥的工作，我更愿意选择有风险但回报高的机会。', reverse: false },
            { id: 28, dim: 4, text: '我倾向于避免不熟悉或不可预测的情况。', reverse: true },
            { id: 29, dim: 4, text: '我愿意为了追求刺激而打破常规。', reverse: false },
            { id: 30, dim: 4, text: '我做事通常三思而后行，不轻易冒险。', reverse: true },
            // 维度六：竞争/合作（31-36）
            { id: 31, dim: 5, text: '我喜欢在竞争环境中工作，那让我更有动力。', reverse: false },
            { id: 32, dim: 5, text: '比起个人成绩，我更看重团队的整体成功。', reverse: true },
            { id: 33, dim: 5, text: '我会努力争取比别人做得更好。', reverse: false },
            { id: 34, dim: 5, text: '当与他人合作时，我愿意牺牲自己的利益来维持和谐。', reverse: true },
            { id: 35, dim: 5, text: '获胜对我而言比享受过程更重要。', reverse: false },
            { id: 36, dim: 5, text: '我常常帮助他人，即使这会影响我自己的表现。', reverse: true }
        ];

        // 维度名称（仅用于内部计算，不展示）
        const dimNames = [
            { name: '外向性', low: '内向安静', high: '外向活跃' },
            { name: '理性/感性', low: '感性共情', high: '理性客观' },
            { name: '独立/依赖', low: '依赖合作', high: '独立自主' },
            { name: '秩序/灵活', low: '灵活随性', high: '秩序计划' },
            { name: '冒险/谨慎', low: '谨慎求稳', high: '冒险尝新' },
            { name: '竞争/合作', low: '合作和谐', high: '竞争求胜' }
        ];

        // 选项标签
        const optionLabels = ['非常不同意', '不同意', '中立', '同意', '非常同意'];

        // ============ 角色数据 ============
        const roles = [
            { name: 'Teddy Emmick', desc: '百年后的reton高中生。', dims: [26, 12, 18, 8, 28, 20] },
            { name: 'Landon Emmick', desc: '实验室的天才青年。', dims: [10, 20, 22, 24, 10, 14] },
            { name: 'Bianca Hayes', desc: '沉睡于废弃公馆中的人偶少女。', dims: [12, 10, 8, 18, 6, 14] },
            { name: 'Roland Churchill', desc: '外星人狂热者。', dims: [10, 16, 24, 14, 22, 12] },
            { name: 'Nathan Kingsley', desc: '钟表店的青年。', dims: [18, 14, 20, 22, 12, 16] },
            { name: 'OZ', desc: '可疑的便宜机器人。', dims: [14, 28, 22, 24, 10, 16] },
            { name: 'Cole Stratford', desc: '希望下次不要直接舔脸上的冰淇淋。', dims: [24, 18, 22, 14, 18, 20] },
            { name: 'Emmett Stratford', desc: '可怕的契约精神。', dims: [10, 8, 8, 12, 10, 8] },
            { name: 'Xolga Utsugi', desc: '世界上最倒霉的人。', dims: [8, 24, 14, 24, 10, 22] },
            { name: 'Mr.Toko', desc: 'Johnny?Mr.Toko?还是■■■■■■？', dims: [27, 8, 6, 28, 28, 6] },
            { name: 'Kai Utsugi', desc: '执着于一生又不可强求的目标。', dims: [22, 16, 24, 16, 18, 14] },
            { name: 'Haru Noru', desc: '容易害羞的普通高中生。', dims: [12, 24, 14, 22, 10, 10] },
            { name: 'Dachi Tomo', desc: '友（とも）達（だち）。', dims: [24, 18, 16, 10, 24, 12] },
        ];

        // ============ 状态管理 ============
        let currentQuestionIndex = 0;
        let answers = new Array(questions.length).fill(null);
        let testStarted = false;

        // 初始化显示欢迎页
        function initWelcome() {
            document.getElementById('welcomeScreen').style.display = 'flex';
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('header').style.display = 'none';
            testStarted = false;
            currentQuestionIndex = 0;
            answers = new Array(questions.length).fill(null);
        }

        // 开始测试
        function startTest() {
            testStarted = true;
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('questionScreen').style.display = 'flex';
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('header').style.display = 'block';
            currentQuestionIndex = 0;
            answers = new Array(questions.length).fill(null);
            renderQuestion();
            updateProgress();
        }

        // 渲染当前题目
        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('questionTag').textContent = `第 ${currentQuestionIndex + 1} 题 / 共 ${questions.length} 题`;
            document.getElementById('questionText').textContent = q.text;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            optionLabels.forEach((label, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                if (answers[currentQuestionIndex] === idx + 1) {
                    btn.classList.add('selected');
                }
                btn.innerHTML = `
                    <span class="radio-dot"></span>
                    <span>${label}</span>
                `;
                btn.addEventListener('click', () => selectOption(idx + 1));
                optionsContainer.appendChild(btn);
            });

            document.getElementById('btnPrev').disabled = currentQuestionIndex === 0;
            document.getElementById('btnNext').disabled = answers[currentQuestionIndex] === null;
            document.getElementById('btnNext').textContent = currentQuestionIndex === questions.length - 1 ? '查看结果' : '下一题 →';
        }

        // 选择选项
        function selectOption(value) {
            answers[currentQuestionIndex] = value;
            renderQuestion();
            updateProgress();
        }

        // 更新进度条
        function updateProgress() {
            const answeredCount = answers.filter(a => a !== null).length;
            const progress = (answeredCount / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('headerCounter').textContent = `${currentQuestionIndex + 1} / ${questions.length}`;
        }

        // 下一题
        function nextQuestion() {
            if (answers[currentQuestionIndex] === null) return;
            if (currentQuestionIndex === questions.length - 1) {
                showResult();
                return;
            }
            currentQuestionIndex++;
            renderQuestion();
            updateProgress();
        }

        // 上一题
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
                updateProgress();
            }
        }

        // 计算维度得分
        function calculateDimensionScores() {
            const dimScores = [0, 0, 0, 0, 0, 0];
            questions.forEach((q, idx) => {
                const answer = answers[idx];
                if (answer === null) return;
                let score = answer;
                if (q.reverse) {
                    score = 6 - answer;
                }
                dimScores[q.dim] += score;
            });
            return dimScores;
        }

        // 匹配角色（欧几里得距离最小）
        function matchRole(dimScores) {
            let minDist = Infinity;
            let bestRole = roles[0];
            roles.forEach(role => {
                const dist = Math.sqrt(
                    Math.pow(dimScores[0] - role.dims[0], 2) +
                    Math.pow(dimScores[1] - role.dims[1], 2) +
                    Math.pow(dimScores[2] - role.dims[2], 2) +
                    Math.pow(dimScores[3] - role.dims[3], 2) +
                    Math.pow(dimScores[4] - role.dims[4], 2) +
                    Math.pow(dimScores[5] - role.dims[5], 2)
                );
                if (dist < minDist) {
                    minDist = dist;
                    bestRole = role;
                }
            });
            const maxDist = Math.sqrt(6 * Math.pow(24, 2));
            const matchPercent = Math.max(0, Math.round(100 - (minDist / maxDist) * 100));
            return { role: bestRole, matchPercent };
        }

        // 显示结果
        function showResult() {
            const dimScores = calculateDimensionScores();
            const { role, matchPercent } = matchRole(dimScores);

            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'flex';
            document.getElementById('header').style.display = 'none';

            document.getElementById('resultRoleName').innerHTML = `<span>${role.name}</span>`;
            document.getElementById('resultRoleDesc').textContent = role.desc;
            document.getElementById('resultMatchPercent').textContent = `匹配度：${matchPercent}%`;
        }

        // 重新测试
        function restartTest() {
            testStarted = false;
            currentQuestionIndex = 0;
            answers = new Array(questions.length).fill(null);
            initWelcome();
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            initWelcome();
        });
    </script>
</body>
</html>
